[package]
name = "openchat-mls"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
openmls = { version = "=0.9.0-rc.2", default-features = false }
openmls_basic_credential = { version = "=0.6.0-rc.2", default-features = false }
openmls_rust_crypto = { version = "=0.6.0-rc.2", default-features = false }
openmls_traits = { version = "=0.6.0-rc.2", default-features = false }
tls_codec = { version = "=0.5.0", default-features = false, features = ["std"] }
zeroize = { version = "=1.9.0", features = ["derive"] }

[profile.release]
panic = "unwind"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "warn"
